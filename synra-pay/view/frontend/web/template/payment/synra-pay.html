<!-- SynraPay — hosted session card fields inside the payment method -->
<div class="payment-method synra-pay-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()"/>
        <label data-bind="attr: {'for': getCode()}" class="label synra-pay-label">
            <span data-bind="text: getTitle()"></span>
            <!-- ko if: getIcon() -->
            <img class="synra-pay-icon" alt="SynraPay" data-bind="attr: {src: getIcon()}"/>
            <!-- /ko -->
        </label>
    </div>
    <div class="payment-method-content">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!-- /ko -->

        <!-- ko if: getDescription() -->
        <p class="synra-pay-desc" data-bind="text: getDescription()"></p>
        <!-- /ko -->

        <div class="synra-pay-hs-mount" data-synra-hs-mount="1" data-bind="afterRender: onMount">
            <div class="synra-pay-hs-skeleton" aria-hidden="true">
                <span class="synra-pay-hs-sk synra-pay-hs-sk-label"></span><span class="synra-pay-hs-sk synra-pay-hs-sk-field"></span>
                <span class="synra-pay-hs-sk-row"><span class="synra-pay-hs-sk synra-pay-hs-sk-half"></span><span class="synra-pay-hs-sk synra-pay-hs-sk-half"></span></span>
                <span class="synra-pay-hs-sk synra-pay-hs-sk-label"></span><span class="synra-pay-hs-sk synra-pay-hs-sk-field"></span>
            </div>
            <p class="synra-pay-hs-status" style="display:none"></p>
        </div>

        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!-- /ko -->
        </div>

        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!-- /ko -->
        </div>

        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="click: placeOrder, attr: {title: $t('Place Order')}, css: {disabled: !isPlaceOrderActionAllowed()}, enable: (getCode() == isChecked())"
                        disabled>
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
